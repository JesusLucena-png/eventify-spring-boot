<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo evento | Eventify</title>
</head>

<body>

<h1>Registrar evento</h1>

<form th:action="@{/admin/events}" th:object="${event}" method="post">

    <label>Nombre</label>
    <input type="text" th:field="*{nombre}">

    <label>Fecha</label>
    <input type="datetime-local" th:field="*{fecha}">

    <label>Descripción</label>
    <textarea th:field="*{descripcion}"></textarea>

    <button type="submit">
        Guardar
    </button>

</form>

<a href="/admin/events">
    Volver
</a>

</body>
</html>
