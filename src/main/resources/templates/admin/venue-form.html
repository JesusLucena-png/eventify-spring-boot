<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Venue | Eventify</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        button,
        .back {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #222;
            color: white;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
        }

        button:hover,
        .back:hover {
            background-color: #444;
        }

        .back {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Registrar Venue</h1>

    <form th:action="@{/admin/venues}" th:object="${venue}" method="post">

        <label for="nombre">Nombre</label>
        <input
                type="text"
                id="nombre"
                th:field="*{nombre}"
                required
        >

        <label for="direccion">Dirección</label>
        <input
                type="text"
                id="direccion"
                th:field="*{direccion}"
                required
        >

        <label for="capacidad">Capacidad</label>
        <input
                type="number"
                id="capacidad"
                th:field="*{capacidad}"
                min="1"
                required
        >

        <button type="submit">
            Guardar
        </button>

    </form>

    <a class="back" href="/admin/venues">
        Volver
    </a>

</div>

</body>
</html>
