services:
  postgres:
    image: postgres:17
    container_name: Eventify
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - eventify_data:/var/lib/postgresql/data

volumes:
  eventify_data: